[project]
name = "credit-scoring"
version = "0.1.0"
description = "Comparaison d'une scorecard interpretable et d'un modele de boosting pour le credit scoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.0",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
research = ["jupyterlab>=4.0", "optuna>=3.0", "shap>=0.45", "xgboost>=2.0"]

[project.scripts]
credit-scoring = "credit_scoring.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

